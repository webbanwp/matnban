name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: php -l on all PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  guards:
    name: ABSPATH guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every PHP file (except index.php) must have an ABSPATH or WP_UNINSTALL guard
        run: |
          status=0
          for f in $(find . -name '*.php' -not -name 'index.php'); do
            if ! grep -qE 'ABSPATH|WP_UNINSTALL_PLUGIN' "$f"; then
              echo "::error file=$f::missing ABSPATH guard"
              status=1
            fi
          done
          exit $status
